<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spoils</title>
    <!-- The game lives at /play/ so that anyone who installed it keeps their app and their saved games.
         The bare link used to serve the Phase -1 prototype, which is now archived at /prototype/. -->
    <meta http-equiv="refresh" content="0; url=./play/" />
    <link rel="canonical" href="./play/" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #1f1d1a;
        color: #f1eee8;
        font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      a { color: #93bb5f; }
      p { color: #b9b4ab; max-width: 40ch; }
      .btn {
        display: inline-block;
        margin-top: 12px;
        padding: 14px 28px;
        border-radius: 10px;
        background: #7fa650;
        color: #10200a;
        font-weight: 700;
        text-decoration: none;
      }
      .archive { margin-top: 28px; font-size: 0.85rem; color: #9d978e; }
    </style>
  </head>
  <body>
    <main>
      <h1>Spoils</h1>
      <p>Chess, plus one rule: when a piece captures, it immediately makes one more move using the pattern of the piece it just took.</p>
      <a class="btn" href="./play/">Play</a>
      <p class="archive">Taking you there now. <a href="./prototype/">The old playtest prototype</a> is still available.</p>
    </main>
  </body>
</html>
